name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps (GTK3 / WebKit2GTK-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI (gtk3)
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27

      - name: Build
        run: wails3 build

      - uses: actions/upload-artifact@v4
        with:
          name: wami-auto-fisher-linux
          path: bin/wami-auto-fisher
          if-no-files-found: error

  build-windows:
    name: Build Windows (cross-compile)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Wails CLI is installed with -tags gtk3, which needs the GTK3 dev
      # headers on the Linux runner. The Windows binary itself needs no cgo.
      - name: Install Linux build deps (to build the CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI (gtk3)
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27

      - name: Build
        run: wails3 build GOOS=windows

      - uses: actions/upload-artifact@v4
        with:
          name: wami-auto-fisher-windows
          path: bin/wami-auto-fisher.exe
          if-no-files-found: error

  package:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build-linux, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C artifacts/wami-auto-fisher-linux -czf "dist/wami-auto-fisher_${VERSION}_linux_amd64.tar.gz" wami-auto-fisher
          ( cd artifacts/wami-auto-fisher-windows && zip -q "../../dist/wami-auto-fisher_${VERSION}_windows_amd64.zip" wami-auto-fisher.exe )
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          draft: false
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
