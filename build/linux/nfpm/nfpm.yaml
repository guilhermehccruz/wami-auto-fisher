# Metadata for the Linux packages (deb/rpm/arch) built by `wails3 package`.
# https://nfpm.goreleaser.com

name: "wami-auto-fisher"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "utils"
priority: "optional"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Automates the WAMI active fishing minigame"
vendor: "WAMI Auto Fisher"
homepage: "https://github.com/guilhermehccruz/wami-auto-fisher"
license: "MIT"
release: "1"

contents:
  - src: "./bin/wami-auto-fisher"
    dst: "/usr/local/bin/wami-auto-fisher"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/wami-auto-fisher.png"
  - src: "./build/linux/wami-auto-fisher.desktop"
    dst: "/usr/share/applications/wami-auto-fisher.desktop"

# Built with -tags gtk3, so the WebKit2GTK-4.1 stack is required.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
